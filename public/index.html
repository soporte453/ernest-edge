<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ernest Edge · Journal de trading</title>
<meta name="description" content="Journal de trading, análisis de tu ventaja, backtesting vela a vela y simulador de prueba de fondeo para traders de liquidez.">
<meta property="og:title" content="Ernest Edge · Tu ventaja, medida trade a trade">
<meta property="og:description" content="Journal, análisis, backtesting y simulador de fondeo. Gratis para traders que empiezan.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0E1526">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
:root{
  color-scheme: light;
  --bg:#F3F5FA; --panel:#FFFFFF; --raised:#F7F8FC; --line:#E1E5EF; --line2:#CDD3E2;
  --text:#18213A; --muted:#64708F; --faint:#98A2BD;
  --acc:#C8247A; --acc-soft:rgba(200,36,122,.10); --acc-ink:#FFFFFF;
  --win:#0E9F75; --win-soft:rgba(14,159,117,.12); --loss:#D93D52; --loss-soft:rgba(217,61,82,.11);
  --warn:#C98A12; --warn-soft:rgba(201,138,18,.13); --info:#2F6FE0;
  --shadow:0 1px 2px rgba(24,33,58,.06),0 6px 20px rgba(24,33,58,.05);
  --r-lg:14px; --r-md:10px; --r-sm:7px;
  --fd:"Space Grotesk","Segoe UI",system-ui,sans-serif; --fb:"Figtree","Segoe UI",system-ui,sans-serif;
  --side:232px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme: dark;
  --bg:#0E1526; --panel:#151F35; --raised:#1B2741; --line:#243253; --line2:#30406A;
  --text:#E6EAF5; --muted:#8E9ABB; --faint:#5F6C8F;
  --acc:#E5368F; --acc-soft:rgba(229,54,143,.16); --acc-ink:#FFFFFF;
  --win:#22C79A; --win-soft:rgba(34,199,154,.14); --loss:#F2596B; --loss-soft:rgba(242,89,107,.14);
  --warn:#F4B23F; --warn-soft:rgba(244,178,63,.15); --info:#5B92FF;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.18);
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0E1526; --panel:#151F35; --raised:#1B2741; --line:#243253; --line2:#30406A;
  --text:#E6EAF5; --muted:#8E9ABB; --faint:#5F6C8F;
  --acc:#E5368F; --acc-soft:rgba(229,54,143,.16); --acc-ink:#FFFFFF;
  --win:#22C79A; --win-soft:rgba(34,199,154,.14); --loss:#F2596B; --loss-soft:rgba(242,89,107,.14);
  --warn:#F4B23F; --warn-soft:rgba(244,178,63,.15); --info:#5B92FF;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.18);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--fb);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.num,.kpi .v,td.n,.mono{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--fd);margin:0;letter-spacing:-.01em}
h1{font-size:26px;font-weight:600}
h2{font-size:17px;font-weight:600}
h3{font-size:14px;font-weight:600}
a{color:var(--acc)}
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100%}
/* sidebar */
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;gap:4px;z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--acc);display:grid;place-items:center;color:#fff;font-family:var(--fd);font-weight:700;font-size:15px}
.brand b{font-family:var(--fd);font-size:16px;font-weight:600;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:11.5px}
.nav{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:var(--muted);cursor:pointer;border:0;background:none;width:100%;text-align:left;font-weight:500}
.nav svg{width:18px;height:18px;flex:none}
.nav:hover{background:var(--raised);color:var(--text)}
.nav.on{background:var(--acc-soft);color:var(--acc);font-weight:600}
.side .sp{flex:1}
.side .foot{font-size:11.5px;color:var(--faint);padding:8px 11px;line-height:1.4}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--faint);margin-right:6px;vertical-align:1px}
.dot.ok{background:var(--win)} .dot.warn{background:var(--warn)}
/* main */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:12px 26px;flex-wrap:wrap}
.top .title{flex:1;min-width:160px}
.top .title h1{font-size:21px}
.top .title p{margin:1px 0 0;color:var(--muted);font-size:12.5px}
.content{padding:22px 26px 60px;display:flex;flex-direction:column;gap:18px;max-width:1500px;width:100%}
/* controls */
.sel,.inp{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 10px;min-height:36px}
.sel:hover,.inp:hover{border-color:var(--line2)}
.inp{width:100%}
textarea.inp{min-height:70px;resize:vertical}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:var(--r-sm);padding:8px 14px;min-height:36px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--line2);background:var(--raised)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.win{background:var(--win);border-color:var(--win);color:#fff}
.btn.loss{background:var(--loss);border-color:var(--loss);color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--raised)}
.btn.sm{padding:5px 10px;min-height:30px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.seg{display:inline-flex;background:var(--raised);border:1px solid var(--line);border-radius:var(--r-sm);padding:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:5px;cursor:pointer;color:var(--muted);font-weight:600;font-size:12.5px}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-hero{grid-template-columns:minmax(0,2.1fr) minmax(0,1fr)}
.g-cal{grid-template-columns:minmax(0,1fr) 280px;align-items:start}
.g-side{grid-template-columns:320px minmax(0,1fr);align-items:start}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:13px 14px;min-width:0}
.kpi .l{color:var(--muted);font-size:12px;font-weight:500;display:flex;justify-content:space-between;gap:6px}
.kpi .v{font-family:var(--fd);font-size:23px;font-weight:600;margin-top:3px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{color:var(--muted);font-size:11.5px;margin-top:2px}
.pos{color:var(--win)} .neg{color:var(--loss)} .mut{color:var(--muted)} .wrn{color:var(--warn)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--raised);color:var(--muted);white-space:nowrap}
.pill.win{background:var(--win-soft);color:var(--win)} .pill.loss{background:var(--loss-soft);color:var(--loss)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.acc{background:var(--acc-soft);color:var(--acc)}
.steps{display:inline-flex;gap:3px;vertical-align:middle}
.steps i{width:9px;height:9px;border-radius:3px;background:var(--line2)}
.steps i.on{background:var(--acc)}
/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:600;color:var(--muted);font-size:12px;text-align:left;padding:9px 11px;background:var(--raised);border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
td.n,th.n{text-align:right}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--raised)}
tbody tr:last-child td{border-bottom:0}
/* bars */
.bars{display:flex;flex-direction:column;gap:7px}
.bar-row{display:grid;grid-template-columns:minmax(90px,150px) 1fr 64px;align-items:center;gap:10px;font-size:12.5px}
.bar-row .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .lab small{color:var(--faint);margin-left:4px}
.track{position:relative;height:18px;background:var(--raised);border-radius:5px;overflow:hidden}
.track .mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line2)}
.track .fill{position:absolute;top:3px;bottom:3px;border-radius:3px}
.bar-row .val{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(0,1.1fr);gap:6px}
.cal .hd{font-size:12px;color:var(--muted);font-weight:600;padding:2px 6px}
.day{min-height:92px;border:1px solid var(--line);border-radius:var(--r-md);padding:7px 8px;background:var(--panel);display:flex;flex-direction:column;cursor:pointer;min-width:0}
.day .d{font-size:12px;color:var(--faint);font-weight:600}
.day.out{opacity:.35;cursor:default}
.day.today .d{color:var(--acc)}
.day .p{font-family:var(--fd);font-weight:600;font-size:16px;margin-top:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .i{font-size:11px;color:var(--muted)}
.day.w{background:var(--win-soft);border-color:transparent} .day.w .p{color:var(--win)}
.day.l{background:var(--loss-soft);border-color:transparent} .day.l .p{color:var(--loss)}
.day.wk{background:var(--raised);cursor:default}
/* forms */
.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 14px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-size:12px;color:var(--muted);font-weight:600}
.f.c2{grid-column:span 2} .f.c4{grid-column:1/-1}
.fs{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin-top:6px;color:var(--text);font-family:var(--fd);font-weight:600;font-size:14px}
.fs::after{content:"";flex:1;height:1px;background:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:12.5px;font-weight:500}
.chip:hover{border-color:var(--line2)}
.chip.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc);font-weight:600}
.chip.on.b{background:var(--win-soft);border-color:var(--win);color:var(--win)}
.chip.on.s{background:var(--loss-soft);border-color:var(--loss);color:var(--loss)}
.hint{font-size:11.5px;color:var(--muted)}
/* modal & drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,28,.45);z-index:80;display:flex;justify-content:flex-end;animation:fade .15s ease}
.scrim.center{justify-content:center;align-items:flex-start;padding:40px 16px;overflow:auto}
.sheet{background:var(--panel);width:min(860px,100%);height:100%;overflow:auto;border-left:1px solid var(--line);padding:0 0 30px;animation:slide .2s ease}
.scrim.center .sheet{height:auto;border:1px solid var(--line);border-radius:var(--r-lg);width:min(620px,100%)}
.sheet-h{position:sticky;top:0;background:var(--panel);z-index:2;padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.sheet-h h2{flex:1}
.sheet-b{padding:18px 22px}
@keyframes fade{from{opacity:0}} @keyframes slide{from{transform:translateX(24px);opacity:.4}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:100;box-shadow:var(--shadow);font-size:13px}
.banner{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--raised);font-size:13px;flex-wrap:wrap}
.banner.acc{background:var(--acc-soft);border-color:transparent}
.banner.warn{background:var(--warn-soft);border-color:transparent}
.banner.loss{background:var(--loss-soft);border-color:transparent}
.banner.win{background:var(--win-soft);border-color:transparent}
.banner b{font-weight:700}
.banner .sp{flex:1}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty h2{color:var(--text);margin-bottom:6px}
.empty .row{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li small{color:var(--muted)}
.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.statgrid>div{background:var(--panel);padding:10px 12px;display:flex;justify-content:space-between;gap:8px;font-size:13px}
.statgrid>div span{color:var(--muted)}
.statgrid>div b{font-variant-numeric:tabular-nums;font-weight:600}
.insights{display:flex;flex-direction:column;gap:9px;margin:0;padding:0;list-style:none}
.insights li{display:flex;gap:10px;padding:10px 12px;border-radius:var(--r-md);background:var(--raised);font-size:13px}
.insights li .ic{flex:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:700}
.ic.g{background:var(--win-soft);color:var(--win)} .ic.r{background:var(--loss-soft);color:var(--loss)} .ic.a{background:var(--warn-soft);color:var(--warn)} .ic.m{background:var(--acc-soft);color:var(--acc)}
.ai-out{white-space:pre-wrap;font-size:13.5px;line-height:1.6;background:var(--raised);border-radius:var(--r-md);padding:14px 16px;min-height:60px}
/* backtest */
.bt{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.chartbox{position:relative;height:min(62vh,560px);min-height:360px;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line);background:var(--panel)}
.chartbox .ovl{position:absolute;left:12px;top:10px;z-index:3;display:flex;gap:8px;align-items:center;pointer-events:none;font-size:12px;color:var(--muted)}
.chartbox .ovl b{font-family:var(--fd);color:var(--text);font-size:14px}
.chartbox .pick{position:absolute;inset:auto 12px 12px auto;z-index:3;background:var(--acc);color:#fff;padding:6px 10px;border-radius:7px;font-size:12px;font-weight:600}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.ticket{display:flex;flex-direction:column;gap:12px}
.ticket .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pos-card{border:1px solid var(--acc);background:var(--acc-soft);border-radius:var(--r-md);padding:12px}
.kbd{display:inline-block;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:11px;color:var(--muted);margin:0 2px}
.prog{height:8px;border-radius:6px;background:var(--raised);overflow:hidden}
.prog>i{display:block;height:100%;border-radius:6px;background:var(--acc)}
svg text{font-family:var(--fb)}
.hide{display:none!important}
.impb{display:inline-flex;gap:2px;vertical-align:middle}.impb i{width:6px;height:12px;border-radius:2px}
.nb{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--loss);margin-left:auto}
.nb i{width:7px;height:7px;border-radius:50%;background:var(--loss)}
.mnav{display:none}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.bt{grid-template-columns:1fr}}
@media (max-width:920px){.g-hero,.g2,.g3,.g-cal,.g-side{grid-template-columns:1fr}.form{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .mnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--panel);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));overflow-x:auto;gap:2px}
  .mnav .nav{flex-direction:column;gap:3px;font-size:10.5px;padding:6px 8px;min-width:64px;align-items:center;text-align:center}
  .content{padding:16px 14px 110px}
  .top{padding:10px 14px;position:static}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cal{grid-template-columns:repeat(7,minmax(0,1fr))}
  .cal .wkcol{display:none}
  .day{min-height:62px;padding:5px}
  .day .p{font-size:12px} .day .i{display:none}
  .form{grid-template-columns:1fr}
  .f.c2{grid-column:auto}
}

/* ===== landing / acceso ===== */
.site{min-height:100vh;background:var(--bg);color:var(--text)}
.wrap{max-width:1200px;margin:0 auto;padding:0 28px}
.lnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.lnav .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 26px;padding-top:14px;padding-bottom:14px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;color:var(--text)}
.logo b{font-family:var(--fd);font-weight:700;font-size:20px;letter-spacing:-.01em}
.lnav .links{display:flex;flex-wrap:wrap;gap:4px 22px;flex:1 1 auto}
.lnav .links button{background:none;border:0;color:var(--muted);font-weight:500;cursor:pointer;padding:6px 0;font-size:15px}
.lnav .links button:hover{color:var(--text)}
.hero{display:flex;flex-wrap:wrap;gap:56px;align-items:center;padding-top:80px;padding-bottom:72px}
.hero h1{font-size:clamp(38px,5.4vw,62px);line-height:1.04;letter-spacing:-.03em;font-weight:700}
.lead{font-size:19px;color:var(--muted);max-width:34em;margin:22px 0 0}
.kick{margin:0 0 16px;color:var(--win);font-weight:600;font-size:15px}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.btn.lg{min-height:52px;padding:0 26px;font-size:16.5px;border-radius:11px}
.sec{padding:84px 0;border-top:1px solid var(--line)}

.lfoot{border-top:1px solid var(--line);padding:34px 0 48px;color:var(--muted);font-size:14px}
.acc-split{display:flex;flex-wrap:wrap;min-height:100vh}

<script>
"use strict";
/* ============================================================ utilities */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const num = v => (v === "" || v == null || isNaN(+v)) ? null : +v;
const sum = a => a.reduce((s, x) => s + x, 0);
const mean = a => a.length ? sum(a) / a.length : 0;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pad = n => String(n).padStart(2, "0");
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const parseD = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const dStr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const DOW = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
const MES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const fmt$ = (v, sign = true) => v == null || isNaN(v) ? "–" : (sign && v > 0 ? "+" : v < 0 ? "−" : "") + "$" + Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: Math.abs(v) >= 1000 ? 0 : 2, maximumFractionDigits: Math.abs(v) >= 1000 ? 0 : 2 });
const fmtK = v => v == null || isNaN(v) ? "–" : (v > 0 ? "+" : v < 0 ? "−" : "") + "$" + (Math.abs(v) >= 10000 ? (Math.abs(v) / 1000).toFixed(0) + "k" : Math.abs(v) >= 1000 ? (Math.abs(v) / 1000).toFixed(1) + "k" : Math.abs(v) >= 100 ? Math.round(Math.abs(v)) : Math.abs(v).toFixed(2).replace(/\.00$/, ""));
const fmtR = (v, d = 2) => v == null || isNaN(v) ? "–" : (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(d) + "R";
const fmtP = (v, d = 0) => v == null || isNaN(v) ? "–" : (v * 100).toFixed(d) + "%";
const fmtN = (v, d = 2) => v == null || isNaN(v) || !isFinite(v) ? "–" : (+v).toFixed(d);
const cls = v => v > 0 ? "pos" : v < 0 ? "neg" : "mut";
const ICON = {
  dash: '<path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-4H4zM14 4v4h6V4z"/>',

  edge: '<path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/>',
  bt: '<path d="M5 3v18M5 6h4v6H5M13 9h4v8h-4M17 13h3M13 13h-3"/>',
  prop: '<path d="M12 3l8 4v5c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V7z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',
  set: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>', play: '<path d="M7 5l12 7-12 7z"/>', pause: '<path d="M7 5h3v14H7zM14 5h3v14h-3z"/>',
  step: '<path d="M6 5l9 7-9 7zM17 5v14"/>', back: '<path d="M18 5l-9 7 9 7zM7 5v14"/>', dl: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>', up: '<path d="M12 20V9M7 13l5-5 5 5M5 4h14"/>',
  spark: '<path d="M12 3l2 5.5L20 10l-6 1.5L12 17l-2-5.5L4 10l6-1.5z"/>', trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>', news: '<path d="M4 5h13v14H6a2 2 0 0 1-2-2z"/><path d="M17 8h3v9a2 2 0 0 1-2 2"/><path d="M8 9h5M8 13h5"/>', tool: '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17v3h3l5.3-5.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>', wallet: '<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 13h2M3 10h18M6 6V4h11v2"/>', stairs: '<path d="M4 20h4v-4h4v-4h4V8h4V4"/>', radar: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12l5-5"/>', book: '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M9 7h6M9 11h6"/>', copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>', moon: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>'
};
function ask(msg, { input = null, ok = "Aceptar", danger = false } = {}) {
  return new Promise(res => {
    const box = $("#dlg");
    box.innerHTML = `<div class="scrim center" style="z-index:90"><div class="sheet" role="alertdialog" aria-modal="true" style="width:min(440px,100%)"><div class="sheet-b"><p style="margin:0 0 14px;font-size:14.5px">${esc(msg)}</p>
      ${input != null ? `<input class="inp" id="dlgin" value="${esc(input)}" style="margin-bottom:14px">` : ""}
      <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="dlgno">Cancelar</button><button class="btn ${danger ? "loss" : "pri"}" id="dlgok">${esc(ok)}</button></div></div></div></div>`;
    const done = v => { box.innerHTML = ""; res(v); };
    $("#dlgno").onclick = () => done(input != null ? null : false);
    $("#dlgok").onclick = () => done(input != null ? $("#dlgin").value : true);
    const f = $("#dlgin") || $("#dlgok"); setTimeout(() => f.focus(), 20);
    box.onkeydown = e => { if (e.key === "Enter") $("#dlgok").click(); if (e.key === "Escape") { e.stopPropagation(); $("#dlgno").click(); } };
  });
}
const ic = (n, sw = 1.8) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

/* ============================================================ defaults */
const LISTS = {
  assets: ["XAUUSD", "NAS100", "EURUSD", "GBPUSD", "USDJPY", "BTCUSD", "AUDCAD"],
  sessions: ["Asia", "Londres", "Nueva York", "Solapamiento LDN-NY", "Fuera de sesión"],
  ctxD1: ["Alcista", "Bajista", "Rango"],
  h4: ["Tendencia alcista", "Tendencia bajista", "Rango"],
  sweep: ["SSL (mínimos)", "BSL (máximos)", "EQL (mínimos iguales)", "EQH (máximos iguales)", "Extremo de rango", "Ninguno"],
  tf: ["M1", "M3", "M5", "M15", "H1"],
  model: ["FVG", "CHoCH", "FVG + CHoCH", "Otro"],
  grade: ["A+", "A", "B", "C"],
  emotion: ["Tranquilo", "Confiado", "Ansioso", "Miedo", "Euforia", "Frustrado", "Revancha", "Aburrido"],
  error: ["Ninguno", "Entrada temprana", "Entrada tardía", "Movió el SL", "Cerró antes del TP", "Sobre-lotaje", "Sin setup", "Operó en noticias", "Revancha", "Fuera de horario"]
};
const DEFAULT_SETTINGS = {
  accounts: [
    { id: "MI-CUENTA", type: "Personal", firm: "", phase: "Personal", size: 1000, target: 0, daily: 0.03, total: 0.10, risk: 0.01, status: "Activa" }
  ],
  rules: { maxTrades: 2, stopDay: 2, stopWeek: 5, stopMonth: 8, newsBuffer: 15 },
  planSessions: { "Asia": false, "Londres": true, "Nueva York": true, "Solapamiento LDN-NY": true, "Fuera de sesión": false },
  customStrategies: [],
  onboarded: false,
  sessionHours: [["Asia", 0, 7], ["Londres", 7, 12], ["Solapamiento LDN-NY", 12, 16], ["Nueva York", 16, 21]],
  // [tamaño pip, valor pip $/lote, spread típico (precio), comisión $/lote ida y vuelta] — editables en Ajustes
  pips: { XAUUSD: [0.1, 10, 0.2, 7], NAS100: [1, 1, 1, 0], EURUSD: [0.0001, 10, 0.00002, 6], GBPUSD: [0.0001, 10, 0.00004, 6], USDJPY: [0.01, 6.67, 0.003, 6], BTCUSD: [1, 1, 15, 0], AUDCAD: [0.0001, 7.2, 0.00005, 6] },
  assets: LISTS.assets.slice(),
  theme: "auto"
};

/* ============================================================ state */
const S = {
  settings: structuredClone(DEFAULT_SETTINGS),
  trades: [], bt: [],
  demo: false, demoTrades: [], demoBt: [], plans: {},
  view: "dash",
  f: { acc: "all", range: "all", asset: "all" },
  src: "real",
  cal: null,
  storeMode: "local", storeNote: "",
};

function fixSettings() {
  const st = S.settings; st.pips = st.pips || {};
  for (const [k, v] of Object.entries(DEFAULT_SETTINGS.pips)) { const p = st.pips[k]; if (!p) continue; for (let i = p.length; i < 4; i++) p[i] = v[i]; }
  for (const p of Object.values(st.pips)) for (let i = p.length; i < 4; i++) p[i] = 0;
}
/* ============================================================ derived fields */
function inPlanSession(sess) { return !!S.settings.planSessions[sess]; }
function derive(t) {
  const risk = num(t.risk), pnl = num(t.pnl);
  const R = risk > 0 && pnl != null ? pnl / risk : null;
  const result = pnl == null ? "" : (risk && Math.abs(pnl) <= 0.1 * risk) ? "BE" : pnl > 0 ? "Ganancia" : "Pérdida";
  const align = !t.dir || !t.h4 ? "" : t.h4 === "Rango" ? "Rango" : ((t.dir === "Compra" && t.h4 === "Tendencia alcista") || (t.dir === "Venta" && t.h4 === "Tendencia bajista")) ? "A favor" : "En contra";
  const has = t.ctxD1 || t.h4 || t.sweep || t.tf || t.model;
  const p1 = !!(t.ctxD1 && t.h4 && align !== "En contra");
  const p2 = !!(t.sweep && t.sweep !== "Ninguno");
  const p3 = ["FVG", "CHoCH", "FVG + CHoCH"].includes(t.model) && ["M1", "M3", "M5"].includes(t.tf);
  const p4 = inPlanSession(t.session);
  const steps = [p1, p2, p3, p4];
  const check = has ? steps.filter(Boolean).length : null;
  const e = num(t.entry), sl = num(t.sl), tp = num(t.tp);
  const rr = e != null && sl != null && tp != null && e !== sl ? Math.abs(tp - e) / Math.abs(e - sl) : null;
  let dur = null;
  if (t.time && t.exitTime) { const [a, b] = t.time.split(":").map(Number), [c, d] = t.exitTime.split(":").map(Number); dur = ((c * 60 + d) - (a * 60 + b) + 1440) % 1440; }
  const hour = t.time ? +t.time.split(":")[0] : null;
  const dow = t.date ? parseD(t.date).getDay() : null;
  const pip = S.settings.pips[t.asset];
  const riskCalc = pip && e != null && sl != null && num(t.lot) ? Math.abs(e - sl) / pip[0] * pip[1] * num(t.lot) : null;
  return { ...t, R, result, align, check, steps, rr, dur, hour, dow, riskCalc, month: t.date ? t.date.slice(0, 7) : "", news: Econ.near(t) };
}

/* ============================================================ metrics */
function metrics(list) {
  const tr = list.filter(t => t.result);
  const W = tr.filter(t => t.result === "Ganancia"), L = tr.filter(t => t.result === "Pérdida"), B = tr.filter(t => t.result === "BE");
  const Rs = tr.map(t => t.R ?? 0);
  const gw = sum(W.map(t => +t.pnl)), gl = -sum(L.map(t => +t.pnl));
  const net = sum(tr.map(t => +t.pnl));
  const totR = sum(Rs);
  const avgWR = W.length ? mean(W.map(t => t.R ?? 0)) : 0, avgLR = L.length ? -mean(L.map(t => t.R ?? 0)) : 0;
  const wr = W.length + L.length ? W.length / (W.length + L.length) : 0;
  const payoff = avgLR ? avgWR / avgLR : 0;
  const n = tr.length, expR = n ? totR / n : 0;
  const sd = n > 1 ? Math.sqrt(sum(Rs.map(r => (r - expR) ** 2)) / (n - 1)) : 0;
  const sorted = [...tr].sort(byTime);
  let eq = 0, peak = 0, dd = 0, eqR = 0, peakR = 0, ddR = 0, cl = 0, cw = 0, mcl = 0, mcw = 0;
  const curve = [];
  for (const t of sorted) {
    eq += +t.pnl; eqR += t.R ?? 0;
    peak = Math.max(peak, eq); peakR = Math.max(peakR, eqR);
    dd = Math.max(dd, peak - eq); ddR = Math.max(ddR, peakR - eqR);
    if (t.result === "Pérdida") { cl++; cw = 0; } else if (t.result === "Ganancia") { cw++; cl = 0; }
    mcl = Math.max(mcl, cl); mcw = Math.max(mcw, cw);
    curve.push({ t, eq, eqR, dd: peak - eq, ddR: peakR - eqR });
  }
  const planned = tr.filter(t => t.plan === "Sí").length;
  const withCheck = tr.filter(t => t.check != null);
  const full = withCheck.filter(t => t.check === 4).length;
  const kelly = payoff ? wr - (1 - wr) / payoff : 0;
  const days = groupBy(tr, t => t.date);
  return {
    n, w: W.length, l: L.length, be: B.length, wr, net, gw, gl, pf: gl ? gw / gl : (gw > 0 ? Infinity : 0),
    totR, expR, avgWR, avgLR, payoff, sd, sqn: sd ? expR / sd * Math.sqrt(Math.min(n, 100)) : null,
    dd, ddR, mcl, mcw, curve, disc: n ? planned / n : 0, pct4: withCheck.length ? full / withCheck.length : null,
    nCheck: withCheck.length, kelly, recov: dd ? net / dd : null, beWR: payoff ? 1 / (1 + payoff) : null,
    days: Object.keys(days).length, best: tr.length ? Math.max(...tr.map(t => +t.pnl)) : 0, worst: tr.length ? Math.min(...tr.map(t => +t.pnl)) : 0
  };
}
function byTime(a, b) { return (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")) || (a.created || 0) - (b.created || 0); }
function groupBy(list, fn) { const o = {}; for (const t of list) { const k = fn(t); if (k == null || k === "") continue; (o[k] = o[k] || []).push(t); } return o; }
function breakdown(list, fn, order) {
  const g = groupBy(list.filter(t => t.result), fn);
  const keys = order ? order.filter(k => g[k]) .concat(Object.keys(g).filter(k => !order.includes(k) && !order.map(String).includes(k))) : Object.keys(g);
  return keys.map(k => { const m = metrics(g[k]); return { k, n: m.n, wr: m.wr, totR: m.totR, expR: m.expR, net: m.net }; });
}

/* ============================================================ filtering */
function srcTrades(src = S.src) {
  const raw = src === "bt" ? (S.demo ? S.demoBt : S.bt) : (S.demo ? S.demoTrades : S.trades);
  return raw.map(derive);
}
function filtered(src) {
  let l = srcTrades(src);
  const f = S.f;
  if (f.acc !== "all" && src !== "bt") l = l.filter(t => t.account === f.acc);
  if (f.asset !== "all") l = l.filter(t => t.asset === f.asset);
  if (f.range !== "all") {
    const now = new Date(); let from;
    if (f.range === "30") from = new Date(now - 30 * 864e5);
    else if (f.range === "90") from = new Date(now - 90 * 864e5);
    else if (f.range === "mtd") from = new Date(now.getFullYear(), now.getMonth(), 1);
    else if (f.range === "ytd") from = new Date(now.getFullYear(), 0, 1);
    if (from) { const fs = dStr(from); l = l.filter(t => t.date >= fs); }
  }
  return l.sort(byTime);
}

/* ============================================================ storage */
const Store = {
  db: null, base: null, q: {}, busy: {},
  local() {
    try {
      const s = JSON.parse(localStorage.getItem("tlp_settings") || "null"); if (s) { S.settings = { ...structuredClone(DEFAULT_SETTINGS), ...s }; if (s.onboarded === undefined) S.settings.onboarded = true; fixSettings(); }
      S.trades = JSON.parse(localStorage.getItem("tlp_trades") || "[]");
      S.bt = JSON.parse(localStorage.getItem("tlp_bt") || "[]");
      S.plans = JSON.parse(localStorage.getItem("tlp_plans") || "{}");
    } catch (e) { }
  },
  persistLocal() {
    try {
      localStorage.setItem("tlp_settings", JSON.stringify(S.settings));
      localStorage.setItem("tlp_trades", JSON.stringify(S.trades));
      localStorage.setItem("tlp_bt", JSON.stringify(S.bt));
      localStorage.setItem("tlp_plans", JSON.stringify(S.plans || {}));
    } catch (e) { }
  },
  async init() {
    this.local();
    if (!window.claude || typeof window.claude.use !== "function") { S.storeNote = "Guardado en este navegador"; return; }
    let db = null, user = null;
    try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch (e) { }
    if (!db || !user) { S.storeNote = "Guardado en este navegador"; renderSide(); return; }
    const id = await user.id();
    try { const me = await user.me(); S.me = me ? { name: me.name || "", avatar: me.avatarUrl || me.avatar || "" } : null; } catch (e) { }
    S.hasClaude = true;
    if (!id) { S.storeNote = "Guardado en este navegador"; renderSide(); return; }
    this.db = db; this.base = db.collection("data/users/" + id);
    S.storeMode = "loading"; S.storeNote = "Conectando con tu nube…"; renderSide();
    const localT = S.trades.slice(), localB = S.bt.slice();
    const timer = setTimeout(() => { if (S.storeMode === "loading") { S.storeNote = "Nube sin respuesta: usando datos locales"; renderSide(); } }, 10000);
    let first = true;
    this.base.onSnapshot(snap => {
      if (!snap.metadata.fromCache) clearTimeout(timer);
      const T = [], B = []; let st = null;
      for (const d of snap.docs) {
        const v = d.data(); if (!v) continue;
        if (d.id === "settings") st = v.json ? JSON.parse(v.json) : null;
        else if (d.id.startsWith("t_")) T.push(v);
        else if (d.id.startsWith("b_")) B.push(v);
        else if (d.id.startsWith("p_")) (S.plans = S.plans || {})[v.date] = v;
        else if (d.id.startsWith("e_") && v.events) Econ.add(v.events, v.from, v.to);
      }
      S.trades = T; S.bt = B;
      if (st) { S.settings = { ...structuredClone(DEFAULT_SETTINGS), ...st }; if (st.onboarded === undefined) S.settings.onboarded = true; fixSettings(); }
      S.storeMode = "cloud"; S.storeNote = "Sincronizado en tu cuenta (privado)";
      if (first) { first = false; S.pendingMigrate = (!T.length && !B.length && (localT.length || localB.length)) ? { t: localT, b: localB } : null; }
      this.persistLocal();
      render();
    }, err => { clearTimeout(timer); this.db = null; S.storeMode = "local"; S.storeNote = "Nube no disponible: guardado en este navegador"; render(); });
  },
  async write(id, data) {
    if (!this.db) return;
    while (this.busy[id]) await this.busy[id];
    const p = (data ? this.base.doc(id).set(data) : this.base.doc(id).delete()).catch(e => toast("No se pudo guardar en la nube: " + (e.code || e.message)));
    this.busy[id] = p; await p; delete this.busy[id];
  },
  async saveTrade(t, kind = "t") {
    const arr = kind === "t" ? S.trades : S.bt;
    const i = arr.findIndex(x => x.id === t.id);
    if (i >= 0) arr[i] = t; else arr.push(t);
    this.persistLocal(); render();
    await this.write(kind + "_" + t.id, t);
  },
  async delTrade(id, kind = "t") {
    const arr = kind === "t" ? S.trades : S.bt;
    const i = arr.findIndex(x => x.id === id); if (i >= 0) arr.splice(i, 1);
    this.persistLocal(); render();
    await this.write(kind + "_" + id, null);
  },
  saveSettingsSoon() {
    clearTimeout(this._st); this.persistLocal();
    this._st = setTimeout(() => this.write("settings", { json: JSON.stringify(S.settings) }), 800);
  },
  async bulk(list, kind) {
    for (const t of list) { const arr = kind === "t" ? S.trades : S.bt; if (!arr.find(x => x.id === t.id)) arr.push(t); }
    this.persistLocal(); render();
    for (const t of list) await this.write(kind + "_" + t.id, t);
  }
};

/* ============================================================ demo data (in memory only) */
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function makeDemo() {
  const r = rng(7), out = [];
  const start = new Date(); start.setDate(start.getDate() - 95);
  const assets = ["XAUUSD", "XAUUSD", "XAUUSD", "NAS100", "EURUSD", "GBPUSD", "USDJPY"];
  for (let d = 0; d < 95; d++) {
    const day = new Date(start.getTime() + d * 864e5); const wd = day.getDay();
    if (wd === 0 || wd === 6) continue;
    const nT = r() < 0.25 ? 0 : r() < 0.7 ? 1 : 2;
    for (let k = 0; k < nT; k++) {
      const planOk = r() < 0.82;
      const sess = planOk ? (r() < 0.6 ? "Nueva York" : r() < 0.5 ? "Asia" : "Solapamiento LDN-NY") : (r() < 0.6 ? "Londres" : "Fuera de sesión");
      const dir = r() < 0.55 ? "Compra" : "Venta";
      const against = !planOk && r() < 0.7;
      const range = r() < 0.18;
      const h4 = range ? "Rango" : (dir === "Compra") !== against ? "Tendencia alcista" : "Tendencia bajista";
      const sweep = !planOk && r() < 0.6 ? "Ninguno" : range ? "Extremo de rango" : dir === "Compra" ? (r() < 0.6 ? "SSL (mínimos)" : "EQL (mínimos iguales)") : (r() < 0.6 ? "BSL (máximos)" : "EQH (máximos iguales)");
      const tf = !planOk && r() < 0.5 ? "M15" : ["M5", "M3", "M1"][Math.floor(r() * 3)];
      const model = ["FVG", "CHoCH", "FVG + CHoCH"][Math.floor(r() * 3)];
      const t0 = { session: sess, dir, h4, ctxD1: range ? "Rango" : h4 === "Tendencia alcista" ? "Alcista" : "Bajista", sweep, tf, model };
      const chk = derive({ ...t0 }).check;
      const pw = chk === 4 ? 0.52 : chk === 3 ? 0.42 : 0.26;
      const win = r() < pw, be = !win && r() < 0.1;
      const risk = 50, rrr = 2 + (r() < 0.3 ? 0.5 : 0);
      const pnl = be ? 0 : win ? +(risk * (rrr - r() * 0.4)).toFixed(2) : -(risk * (1 + r() * 0.15)).toFixed(2);
      const hh = sess === "Asia" ? 2 + Math.floor(r() * 4) : sess === "Nueva York" ? 16 + Math.floor(r() * 3) : sess === "Londres" ? 8 + Math.floor(r() * 3) : sess === "Solapamiento LDN-NY" ? 14 + Math.floor(r() * 2) : 22;
      const mm = Math.floor(r() * 12) * 5, durm = 15 + Math.floor(r() * 120);
      const em = !planOk ? ["Ansioso", "Revancha", "Euforia", "Frustrado"][Math.floor(r() * 4)] : r() < 0.7 ? "Tranquilo" : "Confiado";
      const asset = assets[Math.floor(r() * assets.length)];
      const base = asset === "XAUUSD" ? 2600 + d * 2 : asset === "NAS100" ? 20500 + d * 10 : asset === "USDJPY" ? 150 : asset === "EURUSD" ? 1.08 : 1.27;
      const dist = asset === "XAUUSD" ? 5 : asset === "NAS100" ? 25 : asset === "USDJPY" ? 0.15 : 0.0012;
      out.push({
        id: "demo" + out.length, demo: true, created: d * 10 + k, date: dStr(day), time: `${pad(hh)}:${pad(mm)}`,
        exitTime: `${pad((hh + Math.floor((mm + durm) / 60)) % 24)}:${pad((mm + durm) % 60)}`, account: "FONDEO-10K", asset, ...t0,
        setup: "Sweep H1 + " + model, grade: chk === 4 ? (r() < 0.5 ? "A+" : "A") : chk === 3 ? "B" : "C",
        entry: +base.toFixed(5), sl: +(dir === "Compra" ? base - dist : base + dist).toFixed(5), tp: +(dir === "Compra" ? base + dist * rrr : base - dist * rrr).toFixed(5),
        lot: asset === "XAUUSD" ? 0.1 : asset === "NAS100" ? 2 : 0.41, risk, pnl, mfe: win ? +(pnl / risk + r() * 0.6).toFixed(1) : be ? 1 : +(r() < 0.3 ? 1 + r() * 0.5 : r() * 0.8).toFixed(1),
        plan: planOk ? "Sí" : "No", emotion: em, error: planOk ? "Ninguno" : ["Sin setup", "Entrada temprana", "Revancha", "Fuera de horario", "Movió el SL"][Math.floor(r() * 5)], notes: ""
      });
    }
  }
  return out;
}

  else if (today.length >= rl.maxTrades) { k = "acc"; msg = `Límite de ${rl.maxTrades} trades alcanzado. Trabajo terminado: registra y revisa.`; }
  else if (broke) { k = "warn"; msg = `Rompiste el plan hoy. El resto del día es solo observación.`; }
  else if (Rd >= rl.stopDay) { k = "acc"; msg = `Gran día (${fmtR(Rd, 1)}). Cuidado con la euforia: proteger el día también es ganar.`; }
  if (k === "win" || k === "acc") { const w = inNewsWindow(), nh = nextHigh(); if (w) { k = "warn"; msg = `Ventana de noticia: ${w.cur} ${w.title} a las ${hhmm(w.ts)}. No operes hasta ${hhmm(new Date(new Date(w.ts).getTime() + (rl.newsBuffer ?? 15) * 60000))}.`; } else if (nh && new Date(nh.ts).getTime() - Date.now() < 12 * 3600e3) msg += ` Próxima noticia fuerte: ${hhmm(nh.ts)} ${nh.cur} ${nh.title} (${untilTxt(nh.ts)}).`; }
  return { k, msg, Rw, Rm };
}

/* ============================================================ insights */
function insights(list) {
  const out = [], m = metrics(list);
  if (m.n < 5) return [["m", "Registra al menos 20 trades con tus 4 pasos para que el análisis sea fiable."]];
  const exp = (rows, k) => rows.find(r => String(r.k) === String(k));
  const ck = breakdown(list, t => t.check, [4, 3, 2, 1, 0]);
  const c4 = exp(ck, 4), cl = ck.filter(r => +r.k < 4);
  if (c4 && cl.length) { const lowR = sum(cl.map(r => r.totR)), lowN = sum(cl.map(r => r.n)); out.push(c4.expR > lowR / lowN ? ["g", `Con 4/4 ganas ${fmtR(c4.expR)} por trade; con menos de 4 pasos, ${fmtR(lowR / lowN)}. Opera solo 4/4.`] : ["a", `El checklist todavía no marca diferencia (4/4: ${fmtR(c4.expR)} vs resto ${fmtR(lowR / lowN)}). Revisa cómo calificas cada paso.`]); }
  const al = breakdown(list, t => t.align), af = exp(al, "A favor"), ac = exp(al, "En contra");
  if (ac && ac.n >= 2) out.push(["r", `Operar en contra de H4 te ha costado ${fmtR(ac.totR, 1)} en ${ac.n} trades${af ? ` (a favor: ${fmtR(af.expR)} por trade)` : ""}.`]);
  const best = (rows, label) => { const r = rows.filter(x => x.n >= 3).sort((a, b) => b.totR - a.totR); if (r.length > 1) { const w = r[r.length - 1]; out.push(["g", `${label}: ${r[0].k} es tu mejor opción (${fmtR(r[0].totR, 1)} en ${r[0].n} trades); ${w.totR < 0 ? "la peor es" : "la menos rentable es"} ${w.k} (${fmtR(w.totR, 1)}).`]); } };
  best(breakdown(list, t => t.session), "Sesión");
  best(breakdown(list, t => t.tf), "TF de entrada");
  best(breakdown(list, t => t.model), "Modelo de entrada");
  const L = list.filter(t => t.result === "Pérdida" && num(t.mfe) != null), L1 = L.filter(t => +t.mfe >= 1);
  if (L.length >= 4 && L1.length) out.push(["a", `${fmtP(L1.length / L.length)} de tus pérdidas llegaron a +1R antes de girarse. Mover a BE en +1R habría salvado ${fmtN(-sum(L1.map(t => t.R ?? 0)), 1)}R.`]);
  const noPlan = list.filter(t => t.result && t.plan === "No");
  if (noPlan.length) out.push(["r", `Los trades fuera de plan suman ${fmtR(sum(noPlan.map(t => t.R ?? 0)), 1)} en ${noPlan.length} trades. Ese es tu costo de indisciplina.`]);
  const em = breakdown(list, t => t.emotion).sort((a, b) => a.totR - b.totR)[0];
  if (em && em.totR < 0) out.push(["r", `Tu emoción más cara es "${em.k}" (${fmtR(em.totR, 1)}). Cuando la sientas, cierra la plataforma.`]);
  return out.slice(0, 7);
}
function insightsHTML(list) { return `<ul class="insights">${insights(list).map(([k, t]) => `<li><span class="ic ${k}">${k === "g" ? "✓" : k === "r" ? "!" : k === "a" ? "•" : "i"}</span><span>${esc(t)}</span></li>`).join("")}</ul>`; }

function miniCal(list) {

  for (let i = 0; i < off; i++) h += "<div></div>";
  for (let d = 1; d <= dim; d++) {
    const k = `${y}-${pad(mo + 1)}-${pad(d)}`, ts = days[k], p = ts ? sum(ts.map(t => +t.pnl)) : null;

  }
  return h + "</div>";
}

function splitLine(line, d) { const out = []; let cur = "", q = false; for (let i = 0; i < line.length; i++) { const c = line[i]; if (c === '"') { q = !q; continue; } if (c === d && !q) { out.push(cur); cur = ""; } else cur += c; } out.push(cur); return out.map(s => s.trim()); }

function parseTs(dateS, timeS) {

  if (/^\d{9,13}(\.\d+)?$/.test(s) && !timeS) { const v = +s; return v > 1e12 ? Math.floor(v / 1000) : Math.floor(v); }

  if (!t) { const m = s.match(/^(\S+)[ T](\d{1,2}:\d{2}(:\d{2})?)/); if (m) { s = m[1]; t = m[2]; } }

  if (p.length < 3 || p.some(isNaN)) { const v = Date.parse(dateS); return isNaN(v) ? null : Math.floor(v / 1000); }
  if (p[0] > 999) [y, mo, d] = p; else [d, mo, y] = p;

  return Math.floor(Date.UTC(y, mo - 1, d, hh, mm, ss) / 1000);

function parseOHLC(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 10) throw new Error("El archivo tiene muy pocas filas");
  const d = detectDelim(lines[0]);
  let head = splitLine(lines[0], d).map(h => h.toLowerCase().replace(/[<>"]/g, ""));
  const hasHead = head.some(h => /open|apertura|close|cierre/.test(h));
  const find = re => head.findIndex(h => re.test(h));
  let iD, iT, iO, iH, iL, iC;
  if (hasHead) { iD = find(/^(date|fecha|time|datetime|timestamp|gmt time|local time)/); iT = find(/^(time|hora)$/); if (iT === iD) iT = -1; iO = find(/^(open|apertura)/); iH = find(/^(high|max|alto)/); iL = find(/^(low|min|bajo)/); iC = find(/^(close|cierre)/); }
  else { const c = splitLine(lines[0], d); const timeLike = /^\d{1,2}:\d{2}/.test(c[1]); iD = 0; iT = timeLike ? 1 : -1; const b = timeLike ? 2 : 1; [iO, iH, iL, iC] = [b, b + 1, b + 2, b + 3]; }
  if ([iD, iO, iH, iL, iC].some(x => x < 0)) throw new Error("No encontré columnas de fecha, open, high, low y close");
  const bars = [];
  for (let k = hasHead ? 1 : 0; k < lines.length; k++) {
    const c = splitLine(lines[k], d);
    const t = parseTs(c[iD], iT >= 0 ? c[iT] : null), o = toNum(c[iO]), h = toNum(c[iH]), l = toNum(c[iL]), cl = toNum(c[iC]);
    if (t == null || [o, h, l, cl].some(v => v == null)) continue;
    bars.push({ t, o, h: Math.max(h, o, cl), l: Math.min(l, o, cl), c: cl });
  }
  bars.sort((a, b) => a.t - b.t);
  const uniq = bars.filter((b, i) => i === 0 || b.t > bars[i - 1].t);
  if (uniq.length < 50) throw new Error("Menos de 50 velas válidas");
  const diffs = []; for (let i = 1; i < Math.min(uniq.length, 500); i++) diffs.push(uniq[i].t - uniq[i - 1].t);
  diffs.sort((a, b) => a - b); const tf = Math.max(1, Math.round(diffs[Math.floor(diffs.length / 2)] / 60));
  return { bars: uniq, tf };
}

async function saveDataset(bars, tf, symGuess, source) {
  const sym = await ask(`Se leyeron ${bars.length.toLocaleString()} velas de ${tfName(tf)} (${source}). ¿Qué activo es? Debe existir en Ajustes → Activos para calcular lotes y costos.`, { input: symGuess, ok: "Continuar" });
  if (sym == null || !sym.trim()) return;
  const symbol = sym.trim().toUpperCase();
  const same = Object.values(BT.cache || {}).find(d => d.symbol === symbol && d.tf === tf);
  let ds;
  if (same && await ask(`Ya tienes ${same.name}. ¿Agregar estas velas a esos datos? Se combinan sin duplicar.`, { ok: "Agregar a mis datos" })) {
    const m = new Map(same.bars.map(b => [b.t, b])); bars.forEach(b => m.set(b.t, b));
    const all = [...m.values()].sort((a, b) => a.t - b.t), before = same.bars.length;
    ds = { ...same, bars: all }; toast(`${(all.length - before).toLocaleString()} velas nuevas agregadas`);
  } else ds = { id: "ds" + uid(), symbol, tf, bars };
  const iso = t => new Date(t * 1000).toISOString().slice(0, 10);
  ds.name = `${symbol} ${tfName(tf)} · ${iso(ds.bars[0].t)} a ${iso(ds.bars[ds.bars.length - 1].t)}`;
  await IDB.put(ds); BT.cache = BT.cache || {}; BT.cache[ds.id] = ds;
  BT.metas = BT.metas.filter(m => m.id !== ds.id); BT.metas.push({ id: ds.id, name: ds.name, symbol, tf, n: ds.bars.length });
  if (!same || ds.id !== same.id) toast("Datos guardados en este dispositivo");
  BT.select(ds.id);
}
function guessAsset(s) {
  const t = String(s).toUpperCase().replace(/^.*:/, "").replace(/[^A-Z0-9]/g, "");

  if (alias[t]) return alias[t];
  return S.settings.assets.find(a => t.includes(a.replace(/\W/g, ""))) || t.slice(0, 10);
}

<script>
"use strict";
/* ============================================================ standalone mode (Supabase + Netlify) */
const CFG = window.EE_CONFIG || {};
const SB_ON = !!(window.supabase && CFG.supabaseUrl && CFG.supabaseAnonKey && !/PEGA|TU_|xxxx/i.test(CFG.supabaseUrl + CFG.supabaseAnonKey));
S.mode = SB_ON ? "sb" : (window.claude && typeof window.claude.use === "function") ? "claude" : "local";
function aiAvailable() { return S.mode === "sb" ? !!CFG.aiEndpoint : S.mode === "claude"; }
function appUrl() { return S.mode === "sb" ? location.origin + location.pathname : SHARE_URL; }

if (SB_ON) {
  S.storeMode = "loading"; S.storeNote = "Comprobando tu sesión…";
  Store.local = function () { };
  Store.persistLocal = function () { };
  Store.init = async function () {
    this.sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
    S.storeMode = "loading"; S.storeNote = "Comprobando tu sesión…";
    this.sb.auth.onAuthStateChange((ev, session) => {
      if (ev === "PASSWORD_RECOVERY") { S.recovery = true; S.screen = "acceso"; setTimeout(render, 0); return; }
      if (ev === "SIGNED_IN" || ev === "SIGNED_OUT" || ev === "USER_UPDATED") setTimeout(() => this.useSession(session, ev), 0);
    });
    const { data } = await this.sb.auth.getSession();
    await this.useSession(data.session, "INITIAL");
  };
  Store.useSession = async function (session, ev) {
    const uid = session ? session.user.id : null;
    if (uid && uid === this.uid && ev !== "INITIAL" && ev !== "USER_UPDATED") return;
    obShown = false; if (!uid || uid !== this.uid) closeLayer();
    if (!session) {
      this.uid = null; S.signedIn = false; S.me = null; S.trades = []; S.bt = []; S.plans = {}; S.settings = structuredClone(DEFAULT_SETTINGS);
      S.storeMode = "signedout"; S.storeNote = "Sin sesión";
      if (S.screen === "app") S.screen = "acceso";
      render(); return;
    }
    this.uid = uid; S.signedIn = true;
    const md = session.user.user_metadata || {};
    S.me = { name: md.name || md.full_name || (session.user.email || "").split("@")[0], avatar: md.avatar_url || "" };
    S.storeMode = "loading"; S.storeNote = "Cargando tus datos…"; render();
    const T = [], B = [], P = {}; let st = null, from = 0;
    while (true) {
      const { data, error } = await this.sb.from("items").select("id,kind,data").order("id").range(from, from + 999);
      if (error) { S.storeMode = "local"; S.storeNote = "No se pudo cargar: " + error.message; render(); return; }
      for (const r of data) { if (r.id === "settings") st = r.data && r.data.json ? JSON.parse(r.data.json) : null; else if (r.kind === "t") T.push(r.data); else if (r.kind === "b") B.push(r.data); else if (r.kind === "p") P[r.data.date] = r.data; }
      if (data.length < 1000) break; from += 1000;
    }
    S.trades = T; S.bt = B; S.plans = P; S.settings = st ? { ...structuredClone(DEFAULT_SETTINGS), ...st } : structuredClone(DEFAULT_SETTINGS);
    if (st && st.onboarded === undefined) S.settings.onboarded = true;
    fixSettings();
    S.storeMode = "cloud"; S.storeNote = "Sincronizado en tu cuenta";
    if (ev === "SIGNED_IN" && S.screen === "acceso" && !S.recovery) { S.screen = "app"; try { localStorage.setItem("tlp_entered", "1"); } catch (e) { } setHash(S.view); }
    render();
  };
  Store.write = async function (id, data) {
    if (!this.uid) return;
    while (this.busy[id]) await this.busy[id];
    const kind = id === "settings" ? "settings" : id.slice(0, 1);
    const q = data ? this.sb.from("items").upsert({ user_id: this.uid, id, kind, data, updated_at: new Date().toISOString() }, { onConflict: "user_id,id" })
      : this.sb.from("items").delete().eq("user_id", this.uid).eq("id", id);
    const p = q.then(({ error }) => { if (error) toast("No se pudo guardar: " + error.message); });
    this.busy[id] = p; await p; delete this.busy[id];
  };
}

/* ---------- auth messages */
function authMsg(e) {
  const m = String((e && e.message) || e || "");
  if (/invalid login/i.test(m)) return "Correo o contraseña incorrectos.";
  if (/not confirmed/i.test(m)) return "Confirma tu correo: revisa la bandeja de entrada (y spam) y abre el enlace.";
  if (/already registered|already exists/i.test(m)) return "Ya existe una cuenta con ese correo. Inicia sesión.";
  if (/password should be|at least/i.test(m)) return "La contraseña debe tener al menos 8 caracteres.";
  if (/rate limit|too many/i.test(m)) return "Demasiados intentos. Espera unos minutos.";
  return m || "No se pudo completar. Inténtalo de nuevo.";
}

  else {

  if (worstH && worstH.totR < -1.5 && plan.length < 3) plan.push(`Evita entrar a las ${pad(worstH.k)}:00: ahí acumulas ${fmtR(worstH.totR, 1)}.`);

function accStats(a) {

  const today = sum(ts.filter(t => t.date === todayStr()).map(t => +t.pnl)), riskUsd = size * (+a.risk || 0);

  const tgt = size * (+a.target || 0), prog = tgt ? clamp(net / tgt, 0, 1) : null;

}

function openAccount(id, type) {

      if (S.f.acc === ex.id) S.f.acc = nid;
      Store.persistLocal();

    render(); toast(ex ? "Cuenta actualizada" : "Cuenta agregada");
  });
}

/* ============================================================ scaling plan (like the Excel "Plan de Escalado") */
function planCfg(acc) {
  S.settings.plan = S.settings.plan || {};
  const p = S.settings.plan[acc.id] || {};
  return { rr: 2, tpm: 20, step: 0.25, eff: 0.7, wr: [0.45, 0.50, 0.55], months: 12, balManual: "", ...p };
}
function escalones(acc, cfg) { const out = []; let b = +acc.size || 0; for (let i = 0; i < 20; i++) { out.push({ n: i + 1, from: b, risk: b * (+acc.risk || 0) }); b = b * (1 + cfg.step); } return out; }
function stepFor(steps, bal) { let k = 0; for (let i = 0; i < steps.length; i++) if (bal >= steps[i].from) k = i; return k; }
function viewPlan() {
  const accs = S.settings.accounts;
  if (!accs.length) return `<div class="card"><div class="empty"><h2>Primero agrega una cuenta</h2><div class="row"><button class="btn pri" data-go="accounts">Ir a Cuentas</button></div></div></div>`;
  const id = S.planAcc && accs.find(a => a.id === S.planAcc) ? S.planAcc : accs[0].id; S.planAcc = id;
  const acc = accs.find(a => a.id === id), cfg = planCfg(acc), st = accStats(acc), rl = S.settings.rules;
  const bal = num(cfg.balManual) != null ? num(cfg.balManual) : st.bal;
  const steps = escalones(acc, cfg), k = stepFor(steps, bal), riskNow = steps[k].risk, next = steps[k + 1];
  const mt = metrics(st.ts), real = mt.n >= 10 ? mt : null;
  const scen = cfg.wr.map((w, i) => {
    const exp = w * cfg.rr - (1 - w), rm = exp * cfg.tpm * cfg.eff, streak = w > 0 && w < 1 ? Math.round(Math.log(cfg.tpm * 12) / Math.log(1 / (1 - w))) : 0, drop = 1 - (1 - (+acc.risk || 0)) ** streak;
    let b = bal; const path = [b];
    for (let m = 0; m < cfg.months; m++) { const r = steps[stepFor(steps, b)].risk; b = Math.max(0, b + rm * r); path.push(b); }
    return { name: ["Conservador", "Base", "Optimista"][i], w, exp, rm, streak, drop, path };
  });
  if (real) { const exp = real.expR; let b = bal; const path = [b]; for (let m = 0; m < cfg.months; m++) { const r = steps[stepFor(steps, b)].risk; b = Math.max(0, b + exp * cfg.tpm * cfg.eff * r); path.push(b); } scen.push({ name: "Tu historial", w: real.wr, exp, rm: exp * cfg.tpm * cfg.eff, streak: real.mcl, drop: 1 - (1 - (+acc.risk || 0)) ** real.mcl, path, mine: true }); }

    ${[0, Math.round(cfg.months / 2), cfg.months].map(m => `<text x="${X(m)}" y="${H - 6}" font-size="11" text-anchor="middle" fill="var(--muted)">${m === 0 ? "Hoy" : "Mes " + m}</text>`).join("")}</svg>

  <div class="kpis">
    <div class="kpi"><div class="l">Balance actual</div><div class="v">${fmt$(bal, false)}</div><div class="s">${num(cfg.balManual) != null ? "escrito a mano" : "capital + resultados del journal"}</div></div>

    <div class="kpi"><div class="l">Riesgo por trade hoy</div><div class="v" style="color:var(--acc)">${fmt$(riskNow, false)}</div><div class="s">${fmtP(acc.risk, 2)} del escalón</div></div>

      ${inp("balManual", "Balance actual (opcional)", cfg.balManual, "any", false, "Vacío = se calcula del journal")}

const CSVCOLS = [["date", "Fecha"], ["time", "Hora"], ["account", "Cuenta"], ["asset", "Activo"], ["session", "Sesión"], ["dir", "Dirección"], ["ctxD1", "Contexto D1"], ["h4", "Estado H4"], ["sweep", "Sweep H1"], ["tf", "TF entrada"], ["model", "Modelo entrada"], ["setup", "Setup"], ["grade", "Calidad"], ["entry", "Entrada"], ["sl", "SL (precio)"], ["tp", "TP (precio)"], ["lot", "Lote"], ["risk", "Riesgo $"], ["pnl", "Resultado $"], ["R", "R múltiplo"], ["result", "Resultado"], ["check", "Checklist 4 pasos"], ["align", "Alineación H4"], ["mfe", "MFE (R)"], ["exitTime", "Hora salida"], ["plan", "¿Siguió el plan?"], ["emotion", "Emoción"], ["error", "Error"], ["notes", "Notas / lección"], ["link", "Captura (link)"], ["btSession", "Sesión backtest"], ["strategy", "Estrategia"]];
async function exportCSV(kind) {
  const list = srcTrades(kind === "b" ? "bt" : "real").sort(byTime);
  if (!list.length) { toast("No hay trades para exportar"); return; }
  const q = v => { v = v == null ? "" : typeof v === "number" ? String(+v.toFixed(4)) : String(v); return /[;"\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  const csv = "\ufeff" + [CSVCOLS.map(c => c[1]).join(";"), ...list.map(t => CSVCOLS.map(([k]) => q(t[k])).join(";"))].join("\n");
  const name = (kind === "b" ? "backtests_" : "journal_") + todayStr() + ".csv";
  const dl = window.claude && await window.claude.use("downloads");
  if (dl) { try { await dl.save({ filename: name, data: csv }); toast("Archivo listo"); } catch (e) { if (e.code !== "declined") toast("No se pudo descargar: " + (e.message || e.code)); } return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = name; a.click();
}
async function importJournal(file) {
  try {
    const lines = (await file.text()).replace(/^\ufeff/, "").split(/\r?\n/).filter(l => l.trim());
    const d = detectDelim(lines[0]), head = splitLine(lines[0], d).map(h => h.toLowerCase());
    const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9$]/g, "");
    const idx = {}; CSVCOLS.forEach(([k, h]) => { const i = head.findIndex(x => norm(x) === norm(h)); if (i >= 0) idx[k] = i; });
    if (idx.date == null || idx.pnl == null) throw new Error("No encontré las columnas Fecha y Resultado $");
    const out = []; let skipped = 0;
    for (let k = 1; k < lines.length; k++) {
      const c = splitLine(lines[k], d), g = key => idx[key] != null ? c[idx[key]] : "";
      if ((g("account") || "").toUpperCase() === "EJEMPLO") { skipped++; continue; }
      let ds = g("date"); const m = ds.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/); if (m) ds = `${m[3].length === 2 ? "20" + m[3] : m[3]}-${pad(m[2])}-${pad(m[1])}`; else ds = ds.slice(0, 10).replace(/\//g, "-");
      if (!/^\d{4}-\d{2}-\d{2}$/.test(ds)) continue;
      const tm = s => { const x = (s || "").match(/(\d{1,2}):(\d{2})/); return x ? `${pad(x[1])}:${x[2]}` : ""; };
      const t = { id: uid(), created: Date.now() + k, date: ds, time: tm(g("time")), exitTime: tm(g("exitTime")) };
      for (const key of ["account", "asset", "session", "dir", "ctxD1", "h4", "sweep", "tf", "model", "setup", "grade", "plan", "emotion", "error", "notes", "link", "strategy"]) { const v = g(key); if (v) t[key] = v; }
      if (t.model === "Cambio de estructura (CHoCH)") t.model = "CHoCH";
      for (const key of ["entry", "sl", "tp", "lot", "risk", "pnl", "mfe"]) { const v = toNum(g(key)); if (v != null) t[key] = v; }
      if (t.pnl == null) continue;
      if (t.asset && !S.settings.assets.includes(t.asset)) S.settings.assets.push(t.asset);
      if (t.account && !S.settings.accounts.find(a => a.id === t.account)) S.settings.accounts.push({ id: t.account, type: "Personal", phase: "Personal", size: 0, daily: 0, total: 0, risk: 0, status: "Activa" });
      out.push(t);
    }
    if (!out.length) throw new Error("No encontré trades válidos");
    if (!(await ask(`¿Importar ${out.length} trades?${skipped ? ` Se omiten ${skipped} filas EJEMPLO.` : ""}`, { ok: "Importar" }))) return;
    S.demo = false; Store.saveSettingsSoon(); await Store.bulk(out, "t"); toast(`${out.length} trades importados`); go("jour");
  } catch (e) { toast("No se pudo importar: " + e.message); }
}

  const ds = el.dataset;
  if (ds.go) { if (el.tagName === "A") e.preventDefault(); return go(ds.go); }
  if (ds.nwk != null) { const q = S.nq; if (ds.nwk === "0") { q.wk = dStr(weekStart(new Date())); q.day = todayStr(); } else { const d = parseD(q.wk); q.wk = dStr(new Date(d.getFullYear(), d.getMonth(), d.getDate() + 7 * +ds.nwk)); q.day = q.wk; } return render(); }
  if (ds.nimp) { S.nq.imp = +ds.nimp; return render(); }
  if (ds.nmine) { S.nq.mine = !S.nq.mine; return render(); }
  if (ds.mg) { S.mq.g = ds.mg; return S._mqDraw && S._mqDraw(); }
  if (ds.mtoggle) { const on = !S.settings.assets.includes(ds.mtoggle); if (!on && S.settings.assets.length === 1) { toast("Deja al menos un activo"); return; } enableMarket(ds.mtoggle, on); Store.saveSettingsSoon(); S._mqDraw && S._mqDraw(); render(); return; }
  if (ds.scanasset) { const all = S.settings.assets, cur = scanAssetList(); const nx = cur.includes(ds.scanasset) ? cur.filter(x => x !== ds.scanasset) : [...cur, ds.scanasset]; S.settings.scanAssets = all.filter(a => nx.includes(a)); Store.saveSettingsSoon(); return render(); }
  if (ds.scanmode) { scanCfg().mode = ds.scanmode; SCAN.err = ""; return render(); }
  if (ds.scanview) { const [d, t, sid] = ds.scanview.split("|"); return scanToReplay(d, +t, sid); }
  if (ds.stratscan) { closeLayer(); Object.assign(scanCfg(), { preset: ds.stratscan, mode: "hist" }); SCAN.res = null; return go("scan"); }
  if (ds.accedit) return openAccount(ds.accedit);
  if (ds.accnew) return openAccount(null, ds.accnew);
  if (ds.accplan) { S.planAcc = ds.accplan; return go("plan"); }
  if (ds.accdel) { const n = srcTrades("real").filter(t => t.account === ds.accdel).length; if (await ask(`¿Eliminar la cuenta ${ds.accdel}? ${n ? `Sus ${n} trades se conservan en el journal.` : ""}`, { ok: "Eliminar", danger: true })) { S.settings.accounts = S.settings.accounts.filter(a => a.id !== ds.accdel); if (S.f.acc === ds.accdel) S.f.acc = "all"; Store.saveSettingsSoon(); render(); toast("Cuenta eliminada"); } return; }
  if (ds.authtab) { S.auth = { tab: ds.authtab, msg: "", ok: "" }; return render(); }
  if (ds.screen) return screen(ds.screen);
  if (ds.scroll) { const t = document.getElementById(ds.scroll); if (t) t.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }); return; }
  if (ds.strat) return openStrat(ds.strat);
  if (ds.sfil) { S.sq[ds.sfil] = ds.v; return render(); }
  if (ds.stratbt || ds.stratnew) {
    const s = allStrategies().find(x => x.id === (ds.stratbt || ds.stratnew)); if (!s) return; closeLayer();
    if (ds.stratbt) { Object.assign(BT.form, s.bt || {}, { strategy: s.name }); toast(`Practicando: ${s.name}`); return go("bt"); }
    return openTrade(null, "t", { strategy: s.name, sweep: s.bt?.sweep, model: s.bt?.model, tf: s.bt?.tf });
  }
  if (ds.stratdel) { if (await ask("¿Eliminar esta estrategia? Los trades que la usan se conservan.", { ok: "Eliminar", danger: true })) { S.settings.customStrategies = (S.settings.customStrategies || []).filter(x => x.id !== ds.stratdel); Store.saveSettingsSoon(); closeLayer(); render(); } return; }
  if (ds.eq) { S.eqMode = ds.eq; return render(); }
  if (ds.edit) return openTrade(ds.edit, "t");
  if (ds.bedit) return openTrade(ds.bedit, "b");
  if (ds.day) return openDay(ds.day);
  if (ds.cal) { const c = S.cal; if (ds.cal === "0") { const n = new Date(); S.cal = { y: n.getFullYear(), m: n.getMonth() }; } else { const d = new Date(c.y, c.m + +ds.cal, 1); S.cal = { y: d.getFullYear(), m: d.getMonth() }; } return render(); }
  if (ds.src) { S.src = ds.src; S.aiText = ""; return render(); }
  if (ds.jr) { S.jq.r = ds.jr; return render(); }
  if (ds.jp) { S.jq.p = ds.jp; return render(); }
  if (ds.psrc) { propCfg().src = ds.psrc; return render(); }
  if (ds.plans) { S.settings.planSessions[ds.plans] = !S.settings.planSessions[ds.plans]; Store.saveSettingsSoon(); return render(); }
  if (ds.theme) { S.settings.theme = ds.theme; Store.saveSettingsSoon(); return render(); }
  if (ds.delacc != null) { if (await ask("¿Eliminar esta cuenta de la lista? Sus trades se conservan.", { ok: "Eliminar", danger: true })) { S.settings.accounts.splice(+ds.delacc, 1); Store.saveSettingsSoon(); render(); } return; }
  if (ds.delasset) { S.settings.assets = S.settings.assets.filter(a => a !== ds.delasset); Store.saveSettingsSoon(); return render(); }
  if (ds.btf) { BT.tf = +ds.btf; BT.draw(true); return; }
  if (ds.bspeed) { BT.speed = +ds.bspeed; $$("[data-bspeed]").forEach(b => b.classList.toggle("on", b === el)); if (BT.playing) BT.play(); return; }
  if (ds.btype) { BT.form.type = ds.btype; BT.refreshPanel(); BT.drawLines(); return; }
  if (ds.pick) { BT.pick = ds.pick; BT.pause(); BT.updOverlay(); return; }
  if (ds.bt) {
    const a = ds.bt;
    if (a === "play") BT.toggle(); else if (a === "step") BT.step(1); else if (a === "step10") BT.step(10); else if (a === "back") BT.back();
    else if (a === "buy") BT.open("Compra"); else if (a === "sell") BT.open("Venta"); else if (a === "close") BT.closeMarket(); else if (a === "be") BT.toBE();
    else if (a === "rr") { BT.autoTP(); BT.refreshPanel(); BT.drawLines(); }
    else if (a === "tv") openTVDialog();
    else if (a === "td") {
      if (!S.signedIn) { toast("Inicia sesión para descargar datos"); return; }
      const asset = await ask("¿Qué activo descargas de Twelve Data? (velas de 5 minutos, hasta 5000 ≈ 17 días de mercado)", { input: S.settings.assets[0], ok: "Descargar" }); if (!asset) return;
      const a2 = asset.trim().toUpperCase(), sym = tdSymbolOf(a2) || a2;
      toast("Descargando…"); try { const bars = await tdBars(sym, "5min", 5000); await saveDataset(bars, 5, a2, "Twelve Data"); } catch (e) { toast(liveErr(e, sym)); }
    }
    else if (a === "delds") { if (await ask("¿Borrar estos datos históricos de este dispositivo?", { ok: "Borrar", danger: true })) { const id = BT.ds.id; await IDB.del(id); delete BT.cache[id]; BT.metas = BT.metas.filter(m => m.id !== id); BT.select("demo-xau"); } }
    return;
  }
  const act = ds.act;
  if (act === "new") return openTrade(null, "t");
  if (act === "strat-new") return openStratForm();
  if (act === "hide-local") { S.hideLocalBanner = true; return render(); }
  if (act === "markets") return openMarkets();
  if (act === "mq-add") { const v = ($("#mqnew").value || "").trim().toUpperCase().replace(/\s+/g, ""), tv = ($("#mqtv").value || "").trim().toUpperCase(); if (!v) return; enableMarket(v, true); if (!S.settings.pips[v]) S.settings.pips[v] = [1, 1, 0, 0]; if (tv) { S.settings.tvSymbols = S.settings.tvSymbols || {}; S.settings.tvSymbols[v] = tv; } Store.saveSettingsSoon(); S._mqDraw && S._mqDraw(); render(); toast(`${v} agregado`); return; }
  if (act === "scan-run") return runHist();
  if (act === "scan-live") return runLive(false);
  if (act === "scan-save") return scanSave();
  if (act === "econ-refresh") { localStorage.removeItem("tlp_econ"); const q = S.nq || {}; const ws = q.wk ? parseD(q.wk) : weekStart(new Date()); return Econ.load(dStr(ws), dStr(new Date(ws.getFullYear(), ws.getMonth(), ws.getDate() + 6)), true); }
  if (act === "brief-ai") return aiBriefing((S.nq && S.nq.day) || todayStr());
  if (act === "tool-mine") { const m = metrics(srcTrades("real")); if (m.n < 5) { toast("Necesitas al menos 5 trades"); return; } Object.assign(S.tools, { wr: +(m.wr * 100).toFixed(1), po: +m.payoff.toFixed(2) }); return render(); }
  if (act === "localcoach") { const o = $("#aiout"); if (o) o.textContent = localCoach(filtered(S.src)); return; }
  if (act === "signout") { if (await ask("¿Cerrar sesión en este dispositivo?", { ok: "Cerrar sesión" })) { S.demo = false; await Store.sb.auth.signOut(); screen("landing"); } return; }
  if (act === "google") { const { error } = await Store.sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.origin + location.pathname } }); if (error) toast(authMsg(error)); return; }
  if (act === "demo-enter") { S.demo = true; S.demoTrades = makeDemo(); S.demoBt = []; S.view = "dash"; return screen("app"); }
  if (act === "copyinvite") { const ta = $("#invite"); try { await navigator.clipboard.writeText(ta.value); toast("Invitación copiada"); } catch (err) { ta.focus(); ta.select(); toast("Selecciona y copia el texto (Ctrl+C)"); } return; }
  if (act === "demo") { S.demo = true; S.demoTrades = makeDemo(); S.demoBt = []; return render(); }
  if (act === "demo-off") { S.demo = false; S.demoTrades = []; S.demoBt = []; return render(); }
  if (act === "theme") { const o = ["auto", "dark", "light"]; S.settings.theme = o[(o.indexOf(S.settings.theme || "auto") + 1) % 3]; Store.saveSettingsSoon(); render(); if (S.view === "bt") viewBT(); return; }
  if (act === "migrate") { const m = S.pendingMigrate; S.pendingMigrate = null; await Store.bulk(m.t, "t"); await Store.bulk(m.b, "b"); toast("Datos subidos a tu cuenta"); return; }
  if (act === "migrate-no") { S.pendingMigrate = null; return render(); }
  if (act === "ai") return runAI();
  if (act === "export-t") return exportCSV("t");
  if (act === "export-b") return exportCSV("b");
  if (act === "bt-edge") { S.src = "bt"; return go("edge"); }
  if (act === "bt-prop") { propCfg().src = "bt"; return go("prop"); }
  if (act === "addacc") { S.settings.accounts.push({ id: "CUENTA-" + (S.settings.accounts.length + 1), type: "Fondeo", firm: "", phase: "Fase 1", size: 10000, target: 0.08, target2: 0.05, daily: 0.05, total: 0.1, risk: 0.005, status: "Activa" }); Store.saveSettingsSoon(); return render(); }
  if (act === "addasset") { const v = ($("#newasset").value || "").trim().toUpperCase(); if (v && !S.settings.assets.includes(v)) { enableMarket(v, true); S.settings.pips[v] = S.settings.pips[v] || [1, 1, 0, 0]; Store.saveSettingsSoon(); render(); } return; }
  if (act === "wipe") { if (!(await ask("Esto borra todos tus trades reales de forma permanente. ¿Continuar?", { ok: "Borrar todo", danger: true }))) return; const ids = S.trades.map(x => x.id); for (const id of ids) await Store.delTrade(id, "t"); toast("Trades borrados"); return; }
});
document.addEventListener("change", e => {
  const t = e.target, d = t.dataset;
  if (d.f) { S.f[d.f] = t.value; return render(); }
  if (d.btDs != null) return BT.select(t.value);
  if (d.btFile != null && t.files[0]) return importDataset(t.files[0]);
  if (d.impJ != null && t.files[0]) return importJournal(t.files[0]);
  if (d.btFilter != null) { BT.filter = t.value; return BT.refreshBottom(); }
  if (d.btPoc != null) { BT.pauseOnClose = t.checked; return; }
  if (d.btStrict != null) { BT.strictLimit = t.checked; return; }
  if (d.btJump != null && t.value) { const [a, b] = t.value.split("T"); BT.jump(parseTs(a, b)); return; }
  if (d.acc != null) { const a = S.settings.accounts[+d.acc]; let v = t.value; if (t.type === "number") v = num(v); if (d.pct && v != null) v = v / 100; a[d.k] = v; Store.saveSettingsSoon(); return; }
  if (d.rule) { S.settings.rules[d.rule] = num(t.value) ?? 0; Store.saveSettingsSoon(); if (S.view === "plan") render(); return; }
  if (d.sh != null) { S.settings.sessionHours[+d.sh][+d.j] = clamp(num(t.value) ?? 0, 0, 24); Store.saveSettingsSoon(); return; }
  if (d.tdsym) { S.settings.tdSymbols = S.settings.tdSymbols || {}; S.settings.tdSymbols[d.tdsym] = t.value.trim().toUpperCase(); Store.saveSettingsSoon(); return; }
  if (d.tvsym) { S.settings.tvSymbols = S.settings.tvSymbols || {}; S.settings.tvSymbols[d.tvsym] = t.value.trim().toUpperCase(); Store.saveSettingsSoon(); return; }
  if (d.pip) { const p = S.settings.pips[d.pip] = S.settings.pips[d.pip] || [1, 1, 0, 0]; p[+d.i] = num(t.value) ?? 0; Store.saveSettingsSoon(); return; }
  if (d.prop) { let v = num(t.value); if (v == null) return; if (d.pct) v /= 100; const P = propCfg(); P[d.prop] = v; if (!["risk", "tpd", "wr", "po", "nManual"].includes(d.prop)) { P.preset = "Personalizada"; P.note = ""; } return render(); }
  if (d.preset != null) { const P = propCfg(), pr = PRESETS[t.value]; P.preset = t.value; if (pr) Object.assign(P, pr); else P.note = ""; return render(); }
  if (d.propsel) { const P = propCfg(); P[d.propsel] = d.propsel === "phases" ? +t.value : t.value; P.preset = "Personalizada"; P.note = ""; return render(); }
  if (d.propchk) { propCfg()[d.propchk] = t.checked; return render(); }
  if (d.ba) { BT.acct[d.ba] = num(t.value) ?? 0; BT.refreshPanel(); return; }
  if (d.toolsel) { S.tools[d.toolsel] = t.value; return render(); }
  if (d.planacc != null) { S.planAcc = t.value; return render(); }
  if (d.scan) { const c = scanCfg(); const nv = ["etf", "minRR", "minScore", "disp", "pivot"].includes(d.scan) ? num(t.value) : t.value; if (nv == null) return; c[d.scan] = nv; return render(); }
  if (d.scanchk) { scanCfg()[d.scanchk] = t.checked; return render(); }
  if (d.plan) { const acc = S.settings.accounts.find(a => a.id === S.planAcc); if (!acc) return; S.settings.plan = S.settings.plan || {}; const p = S.settings.plan[acc.id] = { ...planCfg(acc) }; let v = t.value === "" ? "" : num(t.value); if (v !== "" && v == null) return; if (d.pct && v !== "") v /= 100; p[d.plan] = v; Store.saveSettingsSoon(); return render(); }
  if (d.planwr != null) { const acc = S.settings.accounts.find(a => a.id === S.planAcc); S.settings.plan = S.settings.plan || {}; const p = S.settings.plan[acc.id] = { ...planCfg(acc) }; p.wr = p.wr.slice(); p.wr[+d.planwr] = clamp((num(t.value) || 0) / 100, 0, 1); Store.saveSettingsSoon(); return render(); }
  if (d.slr) { S.settings.slRange = S.settings.slRange || {}; const r = S.settings.slRange[d.slr] = (S.settings.slRange[d.slr] || SL_DEFAULT[d.slr] || [10, 30]).slice(); r[+d.i] = num(t.value) || 0; Store.saveSettingsSoon(); return render(); }
  if (d.bf) { BT.form[d.bf] = t.value; BT.drawLines(); return; }
});
let jqT;
document.addEventListener("input", e => {
  const t = e.target, d = t.dataset;
  if (d.jq) { clearTimeout(jqT); jqT = setTimeout(() => { S.jq.s = t.value; render(); const i = $("[data-jq]"); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 250); }
  if (d.bf) { BT.form[d.bf] = t.value; if (d.bf === "tp") BT.form.tpAuto = false; }
  if (d.bsess != null) BT.sess = t.value;
  if (d.tool) { S.tools[d.tool] = t.value; clearTimeout(window._toolT); window._toolT = setTimeout(() => { const k = d.tool, pos = t.selectionStart; render(); const n = $(`[data-tool="${k}"]`); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { } } }, 450); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#layer").innerHTML) { closeLayer(); return; }
  if (S.view !== "bt" || $("#layer").innerHTML || /INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === " ") { e.preventDefault(); BT.toggle(); } else if (k === "arrowright") { e.preventDefault(); BT.step(1); } else if (k === "arrowleft") { e.preventDefault(); BT.back(); }
  else if (k === "b") BT.open("Compra"); else if (k === "s") BT.open("Venta"); else if (k === "e") BT.closeMarket();
});
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if ((S.settings.theme || "auto") === "auto" && S.view === "bt") { BT.chart = null; viewBT(); } });

/* ============================================================ boot */
function routeFromHash() {
  const h = (location.hash || "").replace("#", "");
  if (h === "inicio") S.screen = "landing";
  else if (h === "acceso") S.screen = "acceso";
  else if (VIEWS.some(v => v[0] === h)) { S.screen = "app"; S.view = h; }
  else { let entered = false; try { entered = localStorage.getItem("tlp_entered") === "1"; } catch (e) { } S.screen = entered ? "app" : "landing"; }
}
window.addEventListener("hashchange", () => { const before = S.screen + S.view; routeFromHash(); if (before !== S.screen + S.view) render(); });
(async function boot() {
  Store.local();
  routeFromHash();
  render();
  tickClock();
  BT.loadMetas();
  Store.init().then(() => { if (S.screen === "app") renderSide(); else render(); });
})();
</script>
